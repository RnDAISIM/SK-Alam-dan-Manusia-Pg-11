            }
        }, 50);

        // 2. CREATE OUR CONTINUOUS BACKGROUND MUSIC
        var continuousBGM = new Audio("data/sound1.mp3");

        var startAudio = function() {

                var playPromise = continuousBGM.play();

                    playPromise.then(function() {
                        bgmStarted = true;

                        window.removeEventListener("keydown", startAudio, true);
